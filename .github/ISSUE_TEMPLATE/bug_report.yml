name: 🐛 Bug Report
description: Create a report to help us identify and fix a bug
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue in Klinikaly! Please provide as much context as possible to help us reproduce and resolve it.
  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: A concise summary of what happened.
      placeholder: e.g. Receptionist cannot reschedule appointments on weekends
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Clear steps to reproduce the behavior.
      placeholder: |
        1. Log in as receptionist (receptionist@example.com)
        2. Navigate to '/receptionist/queue'
        3. Click 'Reschedule' on appointment #...
        4. Select date...
        5. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
      placeholder: e.g. Slot reservation should update atomically and modal should close.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Error Output
      description: What actually occurred, including any exception messages or logs.
      placeholder: e.g. SQLSTATE[22P02]: Invalid text representation...
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database Driver
      description: Which database driver are you using locally or in staging?
      options:
        - PostgreSQL 17 (Production standard)
        - SQLite (Local development / testing)
        - MariaDB / MySQL
        - Other
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did you encounter this bug?
      options:
        - Local Development (php artisan serve / npm run dev)
        - Docker Alpine Container
        - Render.com Staging/Production
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: System & Version Context
      description: PHP version, browser, operating system, and any additional context.
      value: |
        - PHP Version: 8.4
        - OS: Windows / macOS / Linux
        - Browser: Chrome / Firefox / Safari / Edge
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I am using supported versions of PHP (8.4+) and Node (22+).
          required: true

